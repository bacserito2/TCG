<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Tu Carrito - Mi tienda TCG</title>
        <style>
        body { font-family: Arial, sans-serif; background-color: #f8f9fa; margin: 0; padding: 36px; color: #333; }
        .regresar-tienda { display: inline-block; color: #007bff; text-decoration: none; font-weight: bold; margin-bottom: 20px; font-size: 15px; }

        body { font-family: Arial, sans-serif; background-color: #f8f9fa; margin: 0; padding: 30px; color: #333; }
        .regresar-tienda { display: inline-block; color: #007bff; text-decoration: none; font-weight: bold; margin-bottom: 20px; font-size: 15px; }
        .regresar-tienda:hover { text-decoration: underline; }
        
        /* DISEÑO ESTRUCTURAL EN DOS COLUMNAS */
        .contenedor-carrito-global { display: flex; max-width: 1200px; margin: 0 auto; gap: 30px; align-items: flex-start; }
        .seccion-tabla { flex: 2; background: white; padding: 25px; border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .seccion-resumen { flex: 1; background: white; padding: 25px; border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); position: sticky; top: 20px; }

        /* CABECERA DE TABLA Y BOTÓN VACIAR */
        .cabecera-carrito { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .titulo-carrito { font-size: 20px; font-weight: bold; margin: 0; }
        .btn-vaciar { background: none; border: 1px solid #dc3545; color: #dc3545; padding: 6px 12px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 13px; transition: all 0.2s; }
        .btn-vaciar:hover { background: #dc3545; color: white; }

        /* TABLA DE PRODUCTOS */
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { font-size: 13px; color: #666; padding-bottom: 12px; border-bottom: 2px solid #eee; font-weight: normal; }
        td { padding: 15px 0; border-bottom: 1px solid #eee; font-size: 14px; vertical-align: middle; }
        
        .input-cantidad { width: 45px; padding: 6px; border: 1px solid #ccc; border-radius: 4px; text-align: center; font-weight: bold; }
        .codigo-empresa { color: #555; font-family: monospace; font-size: 13px; }
        .nombre-producto { font-weight: bold; color: #222; margin-bottom: 4px; line-height: 1.3; }
        .detalles-producto { font-size: 12px; color: #777; }
        .precio-texto { font-weight: bold; white-space: nowrap; }

                /* BOTÓN DE BORRAR INDIVIDUAL CON MARGEN Y ESTILO MEJORADO */
        .btn-borrar-item { 
            background-color: #f8d7da; 
            color: #721c24; 
            border: 1px solid #f5c6cb; 
            width: 34px; 
            height: 34px; 
            border-radius: 6px; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 15px; 
            transition: all 0.2s; 
            margin-left: 15px; /* 👈 Esto evita que se pegue al precio */
        }
        .btn-borrar-item:hover { 
            background-color: #dc3545; 
            color: white; 
            border-color: #dc3545; 
        }

        /* FILA TOTAL INFERIOR EN TABLA */
        .fila-total td { font-weight: bold; font-size: 15px; border-bottom: none; padding-top: 20px; }

        /* BLOQUE RESUMEN LATERAL */
        .titulo-resumen { font-size: 18px; font-weight: bold; margin: 0 0 20px 0; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .fila-subtotal { display: flex; justify-content: space-between; font-size: 15px; margin-bottom: 25px; }
        .monto-subtotal { font-weight: bold; }

        /* BOTONES DE ACCIÓN */
        .btn-procesar { background-color: #3498db; color: white; border: none; padding: 12px; font-size: 15px; font-weight: bold; width: 100%; border-radius: 4px; cursor: pointer; margin-bottom: 12px; display: flex; align-items: center; justify-content: center; gap: 8px; transition: background 0.2s; }
        .btn-procesar:hover { background-color: #2980b9; }
        .btn-descargar { background-color: #6c757d; color: white; border: none; padding: 12px; font-size: 15px; font-weight: bold; width: 100%; border-radius: 4px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: background 0.2s; }
        .btn-descargar:hover { background-color: #5a6268; }

        /* ESTILOS EXCLUSIVOS PARA LA IMPRESIÓN EN PDF (OCULTA BOTONES INCÓMODOS) */
        @media print {
            body { background: white; padding: 0; margin: 0; }
            .regresar-tienda, .btn-vaciar, .seccion-resumen, .btn-borrar-item, th:last-child, td:last-child { display: none !important; }
            .seccion-tabla { flex: 1; box-shadow: none; padding: 0; }
            .contenedor-carrito-global { display: block; }
            .input-cantidad { border: none; background: transparent; font-size: 14px; -webkit-appearance: none; -moz-appearance: none; appearance: none; }
                    /* Corrección para que el total se imprima perfectamente sin letras raras */
        @media print {
            .seccion-tabla::after { 
                content: "Resumen de pedido \A Subtotal: " attr(data-total); 
                display: block; 
                text-align: right; 
                font-weight: bold; 
                font-size: 16px; 
                margin-top: 40px; 
                white-space: pre-wrap; 
                border-top: 2px dashed #333;
                padding-top: 15px;
            }
        }
    }    
        </style>
    </head>
    <body>

    <!-- COPIAR Y PEGAR ESTO JUSTO AQUÍ ABAJO DE BODY -->
    <div style="text-align: center; margin-bottom: 30px; padding: 20px;">
        <a href="index.html" style="text-decoration: none; color: inherit; display: inline-block;">
            <h1 style="margin: 0; font-size: 28px; font-family: Arial, sans-serif; color: #333; cursor: pointer;">🃏 Mi Tienda de Cartas TCG 🃏</h1>
        </a>
    </div>

        <a href="index.html" class="regresar-tienda"><i class="fa-solid fa-arrow-left"></i> Volver a la Tienda</a>

        <div class="contenedor-carrito-global">
        
            <!-- COLUMNA IZQUIERDA: DETALLE DEL CARRITO -->
            <div class="seccion-tabla" id="bloque-tabla-imprimir">
                <div class="cabecera-carrito">
                    <h2 class="titulo-carrito">Tu carrito</h2>
                    <button class="btn-vaciar" onclick="vaciarCarritoCompleto()"><i class="fa-solid fa-trash-can"></i> Vaciar carrito</button>
                </div>

                <table>
                    <thead>
                        <tr>
                            <th style="width: 60px;">Cant</th>
                            <th style="width: 120px;">Cod Empresa</th>
                            <th>Producto</th>
                            <th style="width: 100px; text-align: right;">Precio</th>
                            <th style="width: 50px; text-align: center;"></th>
                        </tr>
                    </thead>
                    <tbody id="tabla-items-carrito">
                        <!-- Se carga dinámicamente -->
                    </tbody>
                    <tfoot>
                        <tr class="fila-total">
                            <td>TOTAL</td>
                            <td></td>
                            <td></td>
                            <td style="text-align: right; color: #333;" id="tabla-gran-total">S/. 0.00</td>
                            <td></td>
                        </tr>
                    </tfoot>
                </table>
            </div>

            <!-- COLUMNA DERECHA: TOTALES Y ACCIONES -->
            <div class="seccion-resumen">
                <h3 class="titulo-resumen">Resumen de pedido</h3>
                <div class="fila-subtotal">
                    <span>Subtotal :</span>
                    <span class="monto-subtotal" id="resumen-subtotal">S/. 0.00</span>
                </div>
        <button class="btn-procesar" onclick="mandarMensajeDirecto()"><i class="fa-solid fa-credit-card"></i> Procesar compra</button>
        <button class="btn-descargar" onclick="descargarPedidoPDF()"><i class="fa-solid fa-file-download"></i> Descargar pedido</button>
            </div>

        </div>

        <script>
        let carrito = [];

        // Cargar el carrito almacenado en la memoria al abrir la página
        function cargarCarritoDeMemoria() {
            const datosGuardados = localStorage.getItem("carritoGuardado");
            if (datosGuardados) {
                carrito = JSON.parse(datosGuardados);
            }
            renderizarTablaCarrito();
        }
         // Función oficial sin alertas interactivas para enviar directo a WhatsApp
        function mandarMensajeDirecto() {
            if (carrito.length === 0) {
                return; // Si está vacío, corta silenciosamente sin hacer nada
            }

            // 📱 Tu número real de Perú configurado perfectamente sin símbolos
            const numeroWhatsApp = "51976689699"; 

            // ✍️ Redacción del mensaje con el pedido
            let mensaje = "🃏 *¡Hola! Me interesa realizar el siguiente pedido de Cartas TCG:* 🃏\n\n";
            mensaje += "----------------------------------------\n";

            let sumaTotal = 0;

            carrito.forEach((item) => {
                let precioLimpio = String(item.precio || "1.00").toUpperCase().replace(/S\/\./g, "").replace(/S\./g, "").replace(/[^0-9.]/g, "").trim();
                let precioUnidad = parseFloat(precioLimpio);
                if (isNaN(precioUnidad)) precioUnidad = 1.00;

                let subtotalItem = precioUnidad * item.cantidadSeleccionada;
                sumaTotal += subtotalItem;

                mensaje += `*${item.cantidadSeleccionada}x*  ${item.nombre}\n`;
                mensaje += `   _Cód: ${item.codigo} | Rareza: ${item.rareza || 'N/A'}_\n`;
                mensaje += `   _Precio: S/. ${precioUnidad.toFixed(2)} c/u -> Subtotal: S/. ${subtotalItem.toFixed(2)}_\n\n`;
            });

            mensaje += "----------------------------------------\n";
            mensaje += `💰 *TOTAL A PAGAR: S/. ${sumaTotal.toFixed(2)}*\n\n`;
            mensaje += "🙏 _Por favor, confírmame el stock disponible de estos ítems. ¡Gracias!_";

            // Encriptado seguro para evitar errores de URL inválida
            const mensajeEncriptado = encodeURIComponent(mensaje);

            // Dirección oficial de la API de WhatsApp armada de forma nativa y limpia
            const enlaceWhatsApp = "https://wa.me/+51976689699?text=" + mensajeEncriptado;
            // Abrimos la pestaña de WhatsApp de forma directa y segura
            window.open(enlaceWhatsApp, "_blank");
        }

        // Redibujar la tabla con los datos actuales de forma exacta
        function renderizarTablaCarrito() {
            const tbody = document.getElementById("tabla-items-carrito");
            const totalTabla = document.getElementById("tabla-gran-total");
            const totalResumen = document.getElementById("resumen-subtotal");
            const bloqueTabla = document.getElementById("bloque-tabla-imprimir");

            if (carrito.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: #777; padding: 40px;">Tu carrito está vacío.</td></tr>`;
                totalTabla.innerText = "S/. 0.00";
                totalResumen.innerText = "S/. 0.00";
                bloqueTabla.removeAttribute("data-total");
                return;
            }

            tbody.innerHTML = "";
            let sumaTotal = 0;

            carrito.forEach((item) => {
                let precioLimpio = String(item.precio || "1.00").toUpperCase().replace(/S\/\./g, "").replace(/S\./g, "").replace(/[^0-9.]/g, "").trim();
                let precioUnidad = parseFloat(precioLimpio);
                if (isNaN(precioUnidad)) precioUnidad = 1.00;

                let subtotal = precioUnidad * item.cantidadSeleccionada;
                sumaTotal += subtotal;

                const fila = document.createElement("tr");
                fila.innerHTML = `
                    <td>
                        <input type="number" class="input-cantidad" value="${item.cantidadSeleccionada}" min="1" onchange="cambiarCantidadInput('${item.codigo}', this.value)">
                    </td>
                    <td class="codigo-empresa">${item.codigo}</td>
                    <td>
                        <div class="nombre-producto">${item.nombre}</div>
                        <div class="detalles-producto">Colección: ${item.coleccion || 'General'} | Rareza: ${item.rareza || 'N/A'}</div>
                    </td>
                    <td class="precio-texto" style="text-align: right;">S/. ${precioUnidad.toFixed(2)}</td>
                    <td style="text-align: center;">
                        <button class="btn-borrar-item" onclick="eliminarFilaItem('${item.codigo}')" title="Eliminar producto">🗑️</button>
                    </td>
                `;
                tbody.appendChild(fila);
            });

            const textoTotal = `S/. ${sumaTotal.toFixed(2)}`;
            totalTabla.innerText = textoTotal;
            totalResumen.innerText = textoTotal;
            bloqueTabla.setAttribute("data-total", textoTotal);
        }

        // Modificar cantidad desde la caja numérica
        function cambiarCantidadInput(codigo, nuevaCantidad) {
            const producto = carrito.find(item => item.codigo === codigo);
            if (!producto) return;

            let cant = parseInt(nuevaCantidad);
            const stockMaximo = parseInt(String(producto.cantidad).trim()) || 999;

            if (isNaN(cant) || cant <= 0) cant = 1;
            
            if (cant > stockMaximo) {
                cant = stockMaximo;
            }

            producto.cantidadSeleccionada = cant;
            localStorage.setItem("carritoGuardado", JSON.stringify(carrito));
            renderizarTablaCarrito();
        }

        // Eliminar fila individual
        function eliminarFilaItem(codigo) {
            carrito = carrito.filter(item => item.codigo !== codigo);
            localStorage.setItem("carritoGuardado", JSON.stringify(carrito));
            renderizarTablaCarrito();
        }

        // Vaciar carrito por completo
        function vaciarCarritoCompleto() {
            if (carrito.length === 0) return;
            if (confirm("¿Estás seguro de que deseas vaciar todo el carrito?")) {
                carrito = [];
                localStorage.setItem("carritoGuardado", JSON.stringify(carrito));
                renderizarTablaCarrito();
            }
        }

        // Descargar en formato PDF limpio
        function descargarPedidoPDF() {
            if (carrito.length === 0) {
                return;
            }
            window.print();
        }

        // Ejecutar la carga inicial automáticamente
        window.onload = cargarCarritoDeMemoria;
        </script>
    </body>
</html>
